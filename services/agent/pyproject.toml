[project]
name = "olivia-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    "structlog>=24.4.0",
    # PTZ y presets por ONVIF: es el único canal de movimiento que responde en
    # estas XiongMai (el DVRIP no mueve el motor).
    "onvif-zeep>=0.2.12",
    # Chequeos de imagen tras un giro (¿se movió? ¿mira la pared?), sin IA.
    "pillow>=10.0",
    # DVRIP para los snapshots de las XiongMai / iCSee. No está en PyPI al día:
    # pip install git+https://github.com/OpenIPC/python-dvr
    "python-dvr",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 100
