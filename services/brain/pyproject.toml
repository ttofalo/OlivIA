[project]
name = "camaritas-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.1.0",
    "anthropic>=0.40.0",
    "paho-mqtt>=2.1.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "asyncpg>=0.30.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 100
