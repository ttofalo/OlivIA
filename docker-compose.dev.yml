services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/dev.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_dev_data:/mosquitto/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  brain:
    build: ./services/brain
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TLS: "false"
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - media_dev:/media

volumes:
  mosquitto_dev_data:
  pg_dev_data:
  media_dev:
